<footer class="footer" id="footer">
  <div class="content-wrapper">
    <div class="footer-brand">
      <a class="footer-logo" routerLink="/"> Logo </a>

      <div class="footer-info">
        <p>Frontend Developer</p>
        <p>Wuppertal, Germany</p>
      </div>
    </div>

    <p class="footer-copyright">© Oğuz Akankan {{ year }}</p>

    <ul class="footer-links">
      @for (link of links; track link.label) {
        <li>
          <a class="footer-link" [href]="link.href" [attr.target]="link.external ? '_blank' : null">
            {{ link.label }}
          </a>
        </li>
      }
      <li>
        <a class="footer-link" routerLink="/legal-notice">Legal Notice</a>
      </li>
    </ul>
  </div>
</footer>
