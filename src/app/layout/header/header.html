<header class="header" [class.scrolled]="isScrolled()">
  <div class="content-wrapper">
    <div class="header-left">
      <div
        class="lang-switch"
        role="group"
        aria-label="Language"
        [class.de-active]="currentLang() === 'de'"
      >
        <button
          type="button"
          class="lang-option"
          [class.active]="currentLang() === 'en'"
          [attr.aria-pressed]="currentLang() === 'en'"
          (click)="useLanguage('en')"
        >
          EN
        </button>
        <button
          type="button"
          class="lang-option"
          [class.active]="currentLang() === 'de'"
          [attr.aria-pressed]="currentLang() === 'de'"
          (click)="useLanguage('de')"
        >
          DE
        </button>
      </div>

      <nav class="nav">
        <ul class="nav-list">
          <li class="nav-item"><a href="#about-me">About me</a></li>
          <li class="nav-item"><a href="#skills">Skills</a></li>
          <li class="nav-item"><a href="#projects">Projects</a></li>
          <li class="nav-item"><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>

    <a class="header-logo" href="/">
      <img src="assets/images/oguz-logo-white-2.png" width="250" alt="Oğuz Akankan" />
    </a>
  </div>
</header>
